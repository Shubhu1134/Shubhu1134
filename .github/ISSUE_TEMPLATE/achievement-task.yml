name: Achievement Task
description: Create a focused task that can be completed and merged quickly
title: "[Task] "
labels: ["achievement-sprint"]
body:
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - feat
        - fix
        - docs
        - ci
        - chore
    validations:
      required: true
  - type: input
    id: target_repo
    attributes:
      label: Target repository
      description: Repo where this will be implemented
      placeholder: owner/repo
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One clear outcome for this task
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define done state in bullets
      placeholder: |
        - PR opened
        - PR merged
        - Issue closed
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Commands, checks, or review steps that prove the change is done
      placeholder: |
        - Run repo-health workflow
        - Check affected README links
        - Verify workflow syntax in GitHub Actions
    validations:
      required: false
