name: Weekly Achievement Sprint

on:
  schedule:
    # GitHub Actions cron runs in UTC. 03:30 UTC is 09:00 IST.
    - cron: "30 03 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-achievement-sprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-weekly-sprint-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create sprint issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
            const now = new Date();
            const istToday = new Date(now.getTime() + IST_OFFSET_MS);
            const start = new Date(istToday);
            const day = start.getUTCDay();
            const diffToMonday = day === 0 ? -6 : 1 - day;
            start.setUTCDate(start.getUTCDate() + diffToMonday);
            start.setUTCHours(0, 0, 0, 0);

            const end = new Date(start);
            end.setUTCDate(start.getUTCDate() + 6);

            const startISO = start.toISOString().slice(0, 10);
            const endISO = end.toISOString().slice(0, 10);
            const title = `Achievement Sprint: ${startISO} to ${endISO}`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "achievement-sprint",
              per_page: 100
            });

            if (openIssues.find((i) => i.title === title)) {
              console.log(`Issue already exists: ${title}`);
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: "achievement-sprint"
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "achievement-sprint",
                color: "1d76db",
                description: "Weekly execution and achievement tracking"
              });
            }

            const body = [
              `## Weekly Sprint (${startISO} to ${endISO})`,
              "",
              "### Targets",
              "- [ ] Merge 5 PRs",
              "- [ ] Close 3 issues linked to PRs",
              "- [ ] Submit 1 external contribution PR",
              "- [ ] Do 2 meaningful PR reviews/comments",
              "- [ ] Submit 1 discussion answer",
              "- [ ] Ship 1 CI/CD or VPS improvement",
              "",
              "### Priority Repo Order",
              "1. `Shubhu1134`",
              "2. `WebDevelopment`",
              "3. `Advance-java-code-`",
              "4. `docker-deploye-architecture`",
              "5. one external public repo",
              "",
              "### First Actions",
              "- [ ] Ship one `docs` or automation improvement in `Shubhu1134`",
              "- [ ] Ship one fast cleanup or setup fix in `WebDevelopment`",
              "- [ ] Ship one topic index, example, or docs improvement in `Advance-java-code-`",
              "",
              "### Scorecard",
              "| Signal | Target | Current |",
              "| --- | --- | --- |",
              "| Merged PRs | 5 | 0 |",
              "| Closed linked issues | 3 | 0 |",
              "| External contribution PRs | 1 | 0 |",
              "| Reviews/comments | 2 | 0 |",
              "| Discussion answers | 1 | 0 |",
              "| DevOps improvements | 1 | 0 |",
              "",
              "### Minimum Merge Mix",
              "- [ ] 1 `docs` PR",
              "- [ ] 1 `fix` PR",
              "- [ ] 1 `feat`, `chore`, or `ci` PR",
              "",
              "### Daily Log",
              "- [ ] Day 1 progress",
              "- [ ] Day 2 progress",
              "- [ ] Day 3 progress",
              "- [ ] Day 4 progress",
              "- [ ] Day 5 progress",
              "- [ ] Day 6 progress",
              "- [ ] Day 7 review",
              "",
              "### Weekly Review Prompts",
              "- What shipped?",
              "- What blocked speed?",
              "- Which repo should start next week?",
              "- Which reusable checklist or template should be extracted?",
              "",
              "### Links",
              "- Execution board: `ACHIEVEMENT_EXECUTION_BOARD.md`",
              "- Sprint playbook: `ACHIEVEMENT_SPRINT.md`",
              "- Repo acceleration plan: `REPO_ACCELERATION_PLAN.md`",
              "- Contribution guide: `CONTRIBUTING.md`",
              "- PR template: `.github/PULL_REQUEST_TEMPLATE.md`"
            ].join("\n");

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["achievement-sprint"]
            });
